name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Every supported Docker Compose topology renders and contains what it should (server, server+LAN, workstation-remote).
      - run: bash scripts/check-compose.sh
      - run: pnpm typecheck
      - run: pnpm test
      # Real code against a disposable Postgres container (Docker is preinstalled on ubuntu-latest).
      - run: pnpm test:integration
      - run: pnpm build
