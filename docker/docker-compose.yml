name: ratllm
services:
  curator-db:
    container_name: ratllm-db
    image: postgres:17-alpine
    env_file: [../.env]
    volumes: [curator-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-curator} -d $${POSTGRES_DB:-curator}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  curator-web:
    container_name: ratllm-web
    build: { context: .., dockerfile: docker/Dockerfile }
    env_file: [../.env]
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
    ports: ["${CURATOR_PORT:-9090}:3000"]
    depends_on:
      curator-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
volumes:
  # Keep the existing volume name so renaming the Compose project does not
  # create an empty database or discard the current Curator inventory.
  curator-db-data:
    name: okame-model-curator_curator-db-data
